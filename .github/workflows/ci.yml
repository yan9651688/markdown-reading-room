name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q assets/app scripts tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build distributable Skill
        run: python scripts/build_release.py --output dist/Markdown-Reading-Room-Skill.zip
      - name: Upload validation artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-Reading-Room-Skill
          path: dist/Markdown-Reading-Room-Skill.zip
          if-no-files-found: error
