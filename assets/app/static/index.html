<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Markdown 阅读室</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/appearance.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/marked.umd.js" defer></script>
    <script src="/vendor/purify.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar">
        <div class="brand-block">
          <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="打开目录">
            <span></span><span></span><span></span>
          </button>
          <a class="brand" href="/" aria-label="返回文档首页">
            <span class="brand-mark" aria-hidden="true">M</span>
            <span class="brand-name">墨阅</span>
          </a>
        </div>

        <div class="topbar-main">
          <label class="search-box" for="searchInput">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索全部来源的标题与正文" />
            <kbd>Ctrl K</kbd>
          </label>
          <section class="search-panel" id="searchPanel" aria-label="全文搜索结果" hidden>
            <header class="search-panel-header">
              <span id="searchSummary">输入关键词搜索全部文档</span>
              <button id="clearSearchButton" type="button">清除</button>
            </header>
            <div class="search-results" id="searchResults" role="listbox"></div>
          </section>
          <div class="topbar-actions">
            <span class="sync-text" id="syncText" aria-live="polite">正在连接</span>
            <div class="theme-control" id="themeControl">
              <button
                class="theme-button"
                id="themeButton"
                type="button"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="themePanel"
                aria-label="打开主题中心"
              >
                <span class="theme-icon" aria-hidden="true"><i></i></span>
                <span id="themeLabel">墨阅</span>
                <span class="theme-chevron" aria-hidden="true"></span>
              </button>
              <section class="theme-panel" id="themePanel" role="dialog" aria-label="主题中心" hidden>
                <header class="theme-panel-header">
                  <div>
                    <span class="theme-panel-kicker">阅读外观</span>
                    <h2>主题中心</h2>
                  </div>
                  <span class="theme-panel-version">v0.4.1</span>
                </header>

                <div class="theme-section">
                  <p class="theme-section-title">风格</p>
                  <div class="theme-grid" role="radiogroup" aria-label="阅读风格">
                    <button class="theme-card" type="button" role="radio" aria-checked="true" data-reading-theme="ink">
                      <span class="theme-card-preview theme-preview-ink" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span class="theme-card-copy"><strong>墨阅</strong><small>安静而克制</small></span>
                      <span class="theme-card-check" aria-hidden="true">✓</span>
                    </button>
                    <button class="theme-card" type="button" role="radio" aria-checked="false" data-reading-theme="github">
                      <span class="theme-card-preview theme-preview-github" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span class="theme-card-copy"><strong>GitHub</strong><small>代码与文档</small></span>
                      <span class="theme-card-check" aria-hidden="true">✓</span>
                    </button>
                    <button class="theme-card" type="button" role="radio" aria-checked="false" data-reading-theme="notion">
                      <span class="theme-card-preview theme-preview-notion" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span class="theme-card-copy"><strong>Notion</strong><small>宽松工作台</small></span>
                      <span class="theme-card-check" aria-hidden="true">✓</span>
                    </button>
                    <button class="theme-card" type="button" role="radio" aria-checked="false" data-reading-theme="codex">
                      <span class="theme-card-preview theme-preview-codex" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span class="theme-card-copy"><strong>Codex</strong><small>专注工作流</small></span>
                      <span class="theme-card-check" aria-hidden="true">✓</span>
                    </button>
                    <button class="theme-card" type="button" role="radio" aria-checked="false" data-reading-theme="claude">
                      <span class="theme-card-preview theme-preview-claude" aria-hidden="true"><i></i><i></i><i></i></span>
                      <span class="theme-card-copy"><strong>Claude</strong><small>温暖纸张感</small></span>
                      <span class="theme-card-check" aria-hidden="true">✓</span>
                    </button>
                  </div>
                </div>

                <div class="theme-section theme-mode-section">
                  <p class="theme-section-title">明暗</p>
                  <div class="mode-switch" role="radiogroup" aria-label="明暗模式">
                    <button type="button" role="radio" aria-checked="true" data-color-mode="system"><span class="mode-icon mode-icon-system" aria-hidden="true"></span>跟随系统</button>
                    <button type="button" role="radio" aria-checked="false" data-color-mode="light"><span class="mode-icon mode-icon-light" aria-hidden="true"></span>浅色</button>
                    <button type="button" role="radio" aria-checked="false" data-color-mode="dark"><span class="mode-icon mode-icon-dark" aria-hidden="true"></span>深色</button>
                  </div>
                </div>

                <footer class="theme-panel-footer">仅改变阅读外观，不会修改任何文档</footer>
              </section>
            </div>
          </div>
        </div>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="文档目录">
        <div class="library-heading">
          <p>Agent 文档书架</p>
          <h1 id="libraryName">正在加载</h1>
          <span id="fileCount">0 篇文档</span>
        </div>
        <nav class="library-sources" id="librarySources" aria-label="按文档来源筛选"></nav>
        <div class="library-tabs" role="tablist" aria-label="目录视图">
          <button class="is-active" type="button" role="tab" aria-selected="true" data-library-view="tree">目录</button>
          <button type="button" role="tab" aria-selected="false" data-library-view="recent">最近</button>
          <button type="button" role="tab" aria-selected="false" data-library-view="favorites">收藏</button>
        </div>
        <nav class="file-tree" id="fileTree"></nav>
        <div class="sidebar-footer">
          <span>自动读取目录中的 Markdown</span>
          <button id="collapseAllButton" type="button">全部收起</button>
        </div>
      </aside>

      <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭目录"></button>

      <main class="reader-pane" id="readerPane">
        <div class="reader-loading" id="readerLoading" role="status">
          <div class="skeleton skeleton-short"></div>
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton skeleton-medium"></div>
        </div>

        <section class="reader-state" id="emptyState" hidden>
          <div class="empty-document" aria-hidden="true"><span></span><span></span><span></span></div>
          <h2>还没有可阅读的 Markdown</h2>
          <p>把 .md 文件放进当前目录，页面会自动出现。</p>
        </section>

        <section class="reader-state" id="errorState" hidden>
          <div class="error-symbol" aria-hidden="true">!</div>
          <h2>文档暂时无法打开</h2>
          <p id="errorMessage">请稍后重试。</p>
          <button id="retryButton" type="button">重新加载</button>
        </section>

        <article class="document-view" id="documentView" hidden>
          <header class="document-header">
            <div class="document-context">
              <span class="source-badge" id="documentSource"></span>
              <p class="breadcrumb" id="breadcrumb"></p>
            </div>
            <div class="document-title-row">
              <h1 id="documentTitle"></h1>
              <button class="favorite-button" id="favoriteButton" type="button" aria-pressed="false" aria-label="收藏当前文档">
                <span id="favoriteIcon" aria-hidden="true">☆</span>
                <span id="favoriteLabel">收藏</span>
              </button>
            </div>
            <div class="document-meta">
              <span id="documentTime"></span>
              <span id="documentSize"></span>
            </div>
          </header>
          <div class="markdown-body" id="article"></div>
          <footer class="document-footer">已到文末</footer>
        </article>
      </main>

      <aside class="outline" id="outline" aria-label="文章大纲">
        <p class="outline-title">本页大纲</p>
        <nav id="outlineNav"></nav>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
