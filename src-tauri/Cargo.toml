[package]
name = "markdown-reading-room"
version = "0.4.2"
description = "A local-first Markdown reading room"
authors = ["Markdown Reading Room contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markdown_reading_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
